; PlatformIO configuration for MakerBase MKS DLC32 V2.1 (ESP32-WROOM-32)
; Builds a grbl_esp32-compatible firmware that:
;   - drives X/Y/Z step+dir signals to the machine drivers
;   - reads servo encoder pulses via PCNT
;   - controls the spindle via PWM
;   - speaks the binary ProtocolFrame (src/common/protocol.h) over UART2

[platformio]
default_envs = mks_dlc32
data_dir     = data

[env:mks_dlc32]
platform  = espressif32
board     = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed  = 921600

; grbl_esp32 core (provides $ settings, motion planner, homing)
lib_deps =
    grbl/grbl-esp32 @ ^1.5.0

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DMACHINE_TYPE= MKS_DLC32_V2_1

; ---- MKS DLC32 V2.1 pin map (matches grbl_esp32 machine target) ----
    -DX_STEP_PIN=12
    -DX_DIR_PIN=14
    -DX_ENABLE_PIN=13
    -DY_STEP_PIN=27
    -DY_DIR_PIN=26
    -DY_ENABLE_PIN=25
    -DZ_STEP_PIN=33
    -DZ_DIR_PIN=32
    -DZ_ENABLE_PIN=15
    -DSPINDLE_PWM_PIN=17

; UART2 used for the binary control protocol with the host PC
    -DPROTOCOL_UART_NUM=2
    -DPROTOCOL_RX_PIN=21
    -DPROTOCOL_TX_PIN=22
    -DPROTOCOL_BAUD=115200

; Servo encoder (A/B quadrature) inputs read with PCNT
    -DENC_X_A_PIN=34
    -DENC_X_B_PIN=35
    -DENC_Y_A_PIN=36
    -DENC_Y_B_PIN=39
    -DENC_Z_A_PIN=18
    -DENC_Z_B_PIN=19
